name: P.E.T CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Keep in sync with the local toolchain (`flutter --version`).
  FLUTTER_VERSION: '3.41.6'

# Least privilege for the GITHUB_TOKEN: these jobs only read the repo.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # lib/firebase_options.dart is gitignored. Restore it from a secret when
      # available; otherwise use the template so the code still compiles.
      - name: Create firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
          else
            cp lib/firebase_options.example.dart lib/firebase_options.dart
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test --coverage

      - name: No raw Log.* calls in native code
        run: bash scripts/check-sensitive-logging.sh

  kotlin-tests:
    name: Native Kotlin unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Placeholder config only: unit tests never talk to Firebase.
      - name: Create placeholder Firebase config
        run: |
          cp lib/firebase_options.example.dart lib/firebase_options.dart
          cat <<EOF > android/app/google-services.json
          {"project_info":{"project_number":"123456789012","project_id":"pet-ci"},
           "client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef1234567890",
             "android_client_info":{"package_name":"com.pet.tracker.pet"}},
             "oauth_client":[],"api_key":[{"current_key":"AIzaSyFakeKeyForCIUnitTests000000000"}],
             "services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],
           "configuration_version":"1"}
          EOF

      # Generates android/local.properties and the Gradle wrapper.
      - name: Prepare Gradle project
        run: |
          flutter pub get
          flutter build apk --config-only

      - name: Run Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain

  backend-tests:
    name: Firestore rules & AI Worker tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cloudflare Worker tests
        working-directory: cloudflare_worker
        run: npm test

      - name: Firestore security rules tests (emulator)
        working-directory: firestore_tests
        run: |
          npm ci || npm install
          npm test

  build-android:
    name: Build Android (CI smoke build — never upload to Play)
    needs: analyze
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Set up Java (for Android build)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
          else
            cp lib/firebase_options.example.dart lib/firebase_options.dart
          fi

      - name: Install dependencies
        run: flutter pub get

      # Only public client-side defines belong here. Server secrets (Groq,
      # RevenueCat secret key) live exclusively in the Cloudflare Worker.
      - name: Create .env.ci
        env:
          RC_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          cat <<EOF > .env.ci
          REVENUECAT_ANDROID_API_KEY=${RC_ANDROID_KEY:-goog_ci_placeholder}
          EOF

      # Throwaway keystore: CI artifacts are for smoke testing only.
      - name: Setup Signing Keystore for CI
        run: |
          keytool -genkey -v -keystore android/app/ci.keystore -alias cikey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=CI, OU=CI, O=CI, L=City, S=State, C=US"
          cat <<EOF > android/app/key.properties
          storeFile=ci.keystore
          storePassword=android
          keyAlias=cikey
          keyPassword=android
          EOF

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "$GOOGLE_SERVICES_SECRET" > android/app/google-services.json
          else
            cat <<EOF > android/app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "pet-tracker",
              "storage_bucket": "pet-tracker.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.pet.tracker.pet"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyFakeKeyForCIBaseBuild123456789"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      # Gradle otherwise downloads the NDK mid-build; that download has failed
      # with a corrupt archive on hosted runners. Pre-install the exact
      # version Flutter expects, with retries.
      - name: Install Android NDK
        run: |
          NDK_VERSION=$(grep -oE 'val ndkVersion: String = "[0-9.]+"' \
            "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" \
            | grep -oE '[0-9][0-9.]+')
          echo "Flutter NDK: $NDK_VERSION"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            if yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" > /dev/null; then
              exit 0
            fi
            echo "NDK install attempt $attempt failed; retrying..."
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            sleep 10
          done
          exit 1

      - name: Build release App Bundle
        run: flutter build appbundle --release --dart-define-from-file=.env.ci

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
