name = "pet-ai-copilot"
main = "src/index.js"
compatibility_date = "2024-03-31"

[vars]
# Firebase project ID — must match the Android app's google-services.json projectId.
# This is NOT a secret; it is a public project identifier.
FIREBASE_PROJECT_ID = "personal-expense-tracker-6891b"
# Firebase project number (used to verify App Check tokens).
FIREBASE_PROJECT_NUMBER = "101986511704"
# Set to "true" after the Android app is registered in Firebase App Check
# (Play Integrity) — requests without a valid App Check token are then rejected.
REQUIRE_APP_CHECK = "false"
# LLM used for all Copilot replies. Check https://console.groq.com/docs/models
# and update here if Groq deprecates it.
GROQ_MODEL = "llama-3.3-70b-versatile"
# Free Copilot questions per signed-in (non-guest) user per calendar month
# (UTC). "0" makes the Copilot premium-only.
FREE_AI_QUESTIONS_PER_MONTH = "3"
# Referral programme: invite codes are for accounts first seen in the last
# N days; each inviter is rewarded at most this many times per year.
REFERRAL_NEW_USER_DAYS = "30"
REFERRAL_MAX_PER_YEAR = "12"

# ─── Required Secrets (set via `wrangler secret put <NAME>`) ─────────────────
# Do NOT put secret values here or in source control.
#
# GROQ_API_KEY         — Groq API key for LLM inference
# REVENUECAT_API_KEY   — RevenueCat secret API key for entitlement verification

# ─── KV Namespace Binding ─────────────────────────────────────────────────────
# Create a KV namespace first:
#   wrangler kv namespace create "KV_LIMITS"
# Then paste the generated id below.
# If a namespace already exists, use: wrangler kv namespace list
[[kv_namespaces]]
binding = "KV_LIMITS"
id = "1ec67e82bc5f4dd7aa13fda71b79747a"
