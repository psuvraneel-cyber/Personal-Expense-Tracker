group 'com.pet.tracker.enginehooks'
version '1.0'

// AGP and the Kotlin Gradle plugin come from the app build's settings.
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.pet.tracker.enginehooks'
    compileSdk 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }
    defaultConfig {
        minSdkVersion 21
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
