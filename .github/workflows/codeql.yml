name: "CodeQL Advanced"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 3 * * 5'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with ci.yml / the local toolchain.
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Create Android local.properties
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_SDK_ROOT"
          } > android/local.properties

      # Firebase client config is gitignored. Use the real files from secrets
      # when available; otherwise compile against the template/placeholder
      # (sufficient for static analysis).
      - name: Create Firebase config files
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
          else
            cp lib/firebase_options.example.dart lib/firebase_options.dart
          fi
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "$GOOGLE_SERVICES_SECRET" > android/app/google-services.json
          else
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "pet-tracker",
              "storage_bucket": "pet-tracker.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": { "package_name": "com.pet.tracker.pet" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyFakeKeyForCIBaseBuild123456789" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
