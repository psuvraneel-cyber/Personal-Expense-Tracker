name = "pet-ai-copilot"
main = "src/index.js"
compatibility_date = "2024-03-31"

[vars]
# Firebase project ID — must match the Android app's google-services.json projectId.
# This is NOT a secret; it is a public project identifier.
FIREBASE_PROJECT_ID = "personal-expense-tracker-6891b"

# ─── Required Secrets (set via `wrangler secret put <NAME>`) ─────────────────
# Do NOT put secret values here or in source control.
#
# GROQ_API_KEY         — Groq API key for LLM inference
# REVENUECAT_API_KEY   — RevenueCat secret API key for entitlement verification

# ─── KV Namespace Binding ─────────────────────────────────────────────────────
# Create a KV namespace first:
#   wrangler kv namespace create "KV_LIMITS"
# Then paste the generated id below.
# If a namespace already exists, use: wrangler kv namespace list
[[kv_namespaces]]
binding = "KV_LIMITS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
